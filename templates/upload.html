{% extends "base.html" %}

{% block title %}上传检测 - 电动车违规检测系统{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header">
                <h4><i class="bi bi-upload"></i> 上传图片或视频</h4>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data" id="uploadForm">
                    <div class="mb-4">
                        <div class="upload-area" id="uploadArea">
                            <i class="bi bi-cloud-upload display-1 text-muted"></i>
                            <p class="mt-3">拖拽文件到此处，或点击选择文件</p>
                            <p class="text-muted small">支持格式: JPG, PNG, MP4, AVI, MOV</p>
                            <input type="file" name="file" id="fileInput" class="d-none" accept=".jpg,.jpeg,.png,.mp4,.avi,.mov">
                        </div>
                    </div>

                    <div id="filePreview" class="mb-4 d-none">
                        <div class="card">
                            <div class="card-body d-flex align-items-center">
                                <i class="bi bi-file-earmark-image fs-1 me-3" id="fileIcon"></i>
                                <div>
                                    <h6 id="fileName" class="mb-1"></h6>
                                    <small class="text-muted" id="fileSize"></small>
                                </div>
                                <button type="button" class="btn btn-outline-danger ms-auto" id="removeFile">
                                    <i class="bi bi-x"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn" disabled>
                            <i class="bi bi-search"></i> 开始检测
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.upload-area {
    border: 2px dashed #ccc;
    border-radius: 10px;
    padding: 60px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
}
.upload-area:hover, .upload-area.dragover {
    border-color: #0d6efd;
    background-color: #f8f9fa;
}
</style>
{% endblock %}

{% block extra_js %}
<script>
const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const filePreview = document.getElementById('filePreview');
const fileName = document.getElementById('fileName');
const fileSize = document.getElementById('fileSize');
const fileIcon = document.getElementById('fileIcon');
const submitBtn = document.getElementById('submitBtn');
const removeFile = document.getElementById('removeFile');

uploadArea.addEventListener('click', () => fileInput.click());

uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
});

uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
});

uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        showPreview(e.dataTransfer.files[0]);
    }
});

fileInput.addEventListener('change', () => {
    if (fileInput.files.length) {
        showPreview(fileInput.files[0]);
    }
});

removeFile.addEventListener('click', () => {
    fileInput.value = '';
    filePreview.classList.add('d-none');
    uploadArea.classList.remove('d-none');
    submitBtn.disabled = true;
});

function showPreview(file) {
    fileName.textContent = file.name;
    fileSize.textContent = formatSize(file.size);

    const isVideo = file.type.startsWith('video/');
    fileIcon.className = isVideo ? 'bi bi-file-earmark-play fs-1 me-3' : 'bi bi-file-earmark-image fs-1 me-3';

    uploadArea.classList.add('d-none');
    filePreview.classList.remove('d-none');
    submitBtn.disabled = false;
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}
</script>
{% endblock %}
