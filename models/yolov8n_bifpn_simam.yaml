# YOLOv8n with BiFPN + SimAM attention
# 改进3: 在BiFPN基础上添加SimAM零参数注意力机制
# SimAM优势: 无额外参数，不与BiFPN冲突，适合轻量模型

nc: 4  # number of classes: ebike, driver, passenger, helmet
scales:
  n: [0.33, 0.25, 1024]

# Backbone (same as original YOLOv8n)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9

# BiFPN-style Head with SimAM attention
head:
  # Top-down pathway (P5 -> P4 -> P3)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11 cat P4
  - [-1, 3, C2f, [512]]                          # 12 P4_td

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                    # 14 cat P3
  - [-1, 3, C2f, [256]]                          # 15 P3_td
  - [-1, 1, SimAM, [256]]                        # 16 SimAM on P3 (small objects)

  # Bottom-up pathway (P3 -> P4 -> P5) with skip connections
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 12, 6], 1, Concat, [1]]                # 18 cat P4_td + P4 (BiFPN style)
  - [-1, 3, C2f, [512]]                          # 19 P4_out
  - [-1, 1, SimAM, [512]]                        # 20 SimAM on P4 (medium objects)

  - [-1, 1, Conv, [512, 3, 2]]                   # 21
  - [[-1, 9, 8], 1, Concat, [1]]                 # 22 cat P5 + C2f_P5 (BiFPN style)
  - [-1, 3, C2f, [1024]]                         # 23 P5_out
  - [-1, 1, SimAM, [1024]]                       # 24 SimAM on P5 (large objects)

  - [[16, 20, 24], 1, Detect, [nc]]              # 25 Detect(P3, P4, P5)
