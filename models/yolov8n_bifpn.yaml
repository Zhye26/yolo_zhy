# YOLOv8n with BiFPN-style weighted feature fusion
# 改进1: 将PANet替换为带权重的特征融合

nc: 4  # number of classes: ebike, driver, passenger, helmet
scales:
  n: [0.33, 0.25, 1024]

# Backbone (same as original YOLOv8n)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9

# BiFPN-style Head with weighted feature fusion
# Key difference: bidirectional connections with more feature reuse
head:
  # Top-down pathway (P5 -> P4 -> P3)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11 cat P4
  - [-1, 3, C2f, [512]]                          # 12 P4_td

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                    # 14 cat P3
  - [-1, 3, C2f, [256]]                          # 15 P3_out (small)

  # Bottom-up pathway (P3 -> P4 -> P5) with skip connections
  - [-1, 1, Conv, [256, 3, 2]]                   # 16
  - [[-1, 12, 6], 1, Concat, [1]]                # 17 cat P4_td + P4 (BiFPN style)
  - [-1, 3, C2f, [512]]                          # 18 P4_out (medium)

  - [-1, 1, Conv, [512, 3, 2]]                   # 19
  - [[-1, 9, 8], 1, Concat, [1]]                 # 20 cat P5 + C2f_P5 (BiFPN style)
  - [-1, 3, C2f, [1024]]                         # 21 P5_out (large)

  - [[15, 18, 21], 1, Detect, [nc]]              # 22 Detect(P3, P4, P5)
