# YOLOv8n with BiFPN + CBAM attention
# 改进2: 在BiFPN基础上添加CBAM注意力机制

nc: 4  # number of classes: ebike, driver, passenger, helmet
scales:
  n: [0.33, 0.25, 1024]

# Backbone (same as original YOLOv8n)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9

# BiFPN-style Head with CBAM attention
# Note: CBAM uses actual channel numbers (after 0.25 width scaling)
# 256->64, 512->128, 1024->256
head:
  # Top-down pathway (P5 -> P4 -> P3)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11 cat P4
  - [-1, 3, C2f, [512]]                          # 12 P4_td

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                    # 14 cat P3
  - [-1, 3, C2f, [256]]                          # 15 P3_td
  - [-1, 1, CBAM, [64]]                          # 16 P3_out + CBAM (small objects, 256*0.25=64)

  # Bottom-up pathway (P3 -> P4 -> P5) with skip connections
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 12, 6], 1, Concat, [1]]                # 18 cat P4_td + P4 (BiFPN style)
  - [-1, 3, C2f, [512]]                          # 19 P4_td2
  - [-1, 1, CBAM, [128]]                         # 20 P4_out + CBAM (medium objects, 512*0.25=128)

  - [-1, 1, Conv, [512, 3, 2]]                   # 21
  - [[-1, 9, 8], 1, Concat, [1]]                 # 22 cat P5 + C2f_P5 (BiFPN style)
  - [-1, 3, C2f, [1024]]                         # 23 P5_td
  - [-1, 1, CBAM, [256]]                         # 24 P5_out + CBAM (large objects, 1024*0.25=256)

  - [[16, 20, 24], 1, Detect, [nc]]              # 25 Detect(P3, P4, P5)
